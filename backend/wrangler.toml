name = "dares"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# D1 (SQLite). Replace database_id after `wrangler d1 create dares`.
[[d1_databases]]
binding = "DB"
database_name = "dares"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Private proof media. Never public; served only through GET /media/:key.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dares-media"

# Hourly tick: week rollover, vote-deadline finalization, deadline reminders.
[triggers]
crons = ["0 * * * *"]

[vars]
# Non-secret configuration. Secrets are set with `wrangler secret put`.
APPLE_BUNDLE_ID = "com.mathys.dares"
APPLE_JWKS_URL = "https://appleid.apple.com/auth/keys"
APNS_ENV = "production"

# v3: public invite links + universal links. Replace before deploying.
PUBLIC_BASE_URL = "https://dares.example.workers.dev"
APPLE_TEAM_ID = "XXXXXXXXXX"
TESTFLIGHT_URL = "https://testflight.apple.com/join/XXXXXXXX"
