name: Dares

options:
  bundleIdPrefix: com.mathys
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_WARN_UNDECLARED_SELECTOR: YES

targets:
  Dares:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Dares
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathys.dares
        PRODUCT_NAME: Dares
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
      configs:
        Debug:
          INFOPLIST_FILE: Dares/Resources/Info-Debug.plist
          # The debug build pushes through the sandbox of Apple.
          CODE_SIGN_ENTITLEMENTS: Dares/Resources/Dares-Debug.entitlements
        Release:
          INFOPLIST_FILE: Dares/Resources/Info.plist
          # The release build pushes through the production of Apple.
          CODE_SIGN_ENTITLEMENTS: Dares/Resources/Dares.entitlements
    scheme:
      testTargets:
        - DaresTests
      gatherCoverageData: false
      commandLineArguments: {}

  DaresTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DaresTests
    dependencies:
      - target: Dares
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathys.dares.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dares.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dares"
        BUNDLE_LOADER: "$(TEST_HOST)"
    scheme:
      testTargets:
        - DaresTests
      gatherCoverageData: false
